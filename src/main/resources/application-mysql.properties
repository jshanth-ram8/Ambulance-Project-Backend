# Used when SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ambulance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
